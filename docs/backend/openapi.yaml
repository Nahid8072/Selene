        object_format:
          type: string
          nullable: true
        object_count:
          type: integer
          nullable: true
        disk_bytes:
          type: integer
          format: int64
          nullable: true
        lease_count:
          type: integer
          minimum: 0
        last_successful_sync_at:
          type: string
          format: date-time
          nullable: true
        last_error_code:
          type: string
          nullable: true
        freshness:
          $ref: "#/components/schemas/Freshness"
        correlation_id:
          type: string
