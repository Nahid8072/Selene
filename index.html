      // Without this class every element renders in its final, visible state.
      (function () {
        var root = document.documentElement;
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        // `?motion=off` renders the settled page, for screenshots and link-preview tools.
        if (/[?&]motion=off\b/.test(location.search)) return;
        root.classList.add("motion");
        // Safety net: if the app bundle never starts, reveal everything rather than leave it hidden.
        setTimeout(function () {
          if (!root.classList.contains("app-ready")) root.classList.remove("motion");
